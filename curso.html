<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Curso | Capacita Gov</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .curso-pagina {
      min-height: 100vh;
      background: #f5f7fb;
    }

    .curso-topo {
      background: #0b5ed7;
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .curso-topo h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .curso-topo-acoes {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .curso-topo button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    #btnVoltar {
      background: #fff;
      color: #0b5ed7;
    }

    #btnSair {
      background: rgba(255,255,255,.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,.3);
    }

    .curso-conteudo {
      width: min(1100px, calc(100% - 32px));
      margin: 30px auto;
    }

    .curso-cabecalho {
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .curso-cabecalho h2 {
      margin: 0 0 10px;
      color: #123;
      font-size: 28px;
    }

    .curso-cabecalho p {
      margin: 0;
      color: #667085;
      line-height: 1.6;
    }

    .curso-secao {
      background: #fff;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .curso-secao h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #123;
    }

    .modulo-card {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .modulo-titulo {
      background: #f8fafc;
      padding: 16px 18px;
      font-weight: 700;
      color: #123;
    }

    .aulas-lista {
      padding: 10px;
    }

    .aula-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 10px;
    }

    .aula-card:last-child {
      margin-bottom: 0;
    }

    .aula-titulo {
      font-weight: 700;
      color: #123;
      margin-bottom: 8px;
    }

    .aula-descricao {
      color: #667085;
      line-height: 1.5;
    }

    .aula-material {
      margin-top: 12px;
    }

    .aula-material a {
      color: #0b5ed7;
      font-weight: 600;
      text-decoration: none;
    }

    .perguntas-lista {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .pergunta-card {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 20px;
      background: #fff;
    }

    .pergunta-numero {
      display: inline-block;
      background: #eaf2ff;
      color: #0b5ed7;
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .pergunta-enunciado {
      margin: 0 0 16px;
      color: #1f2937;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
    }

    .alternativas {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .alternativa {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 13px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: .2s;
      background: #fff;
    }

    .alternativa:hover {
      border-color: #0b5ed7;
      background: #f8fbff;
    }

    .alternativa input {
      margin-top: 3px;
      accent-color: #0b5ed7;
      cursor: pointer;
    }

    .alternativa span {
      color: #374151;
      line-height: 1.4;
    }

    .quiz-acoes {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-finalizar {
      border: none;
      border-radius: 10px;
      background: #0b5ed7;
      color: #fff;
      padding: 13px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-finalizar:hover {
      background: #084298;
    }

    .resultado-quiz {
      display: none;
      margin-top: 20px;
      padding: 22px;
      border-radius: 12px;
      text-align: center;
    }

    .resultado-quiz.sucesso {
      display: block;
      background: #ecfdf3;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .resultado-quiz.erro {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .resultado-percentual {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .resultado-detalhe {
      font-size: 16px;
      font-weight: 600;
    }

    .resultado-mensagem {
      margin-top: 8px;
    }

    #estado {
      width: min(1100px, calc(100% - 32px));
      margin: 30px auto;
      text-align: center;
      color: #667085;
    }

    @media (max-width: 700px) {
      .curso-topo {
        padding: 14px 16px;
      }

      .curso-topo h1 {
        font-size: 18px;
      }

      .curso-topo-acoes {
        gap: 6px;
      }

      .curso-topo button {
        padding: 8px 10px;
        font-size: 13px;
      }

      .curso-conteudo {
        width: min(100% - 20px, 1100px);
        margin: 20px auto;
      }

      .curso-cabecalho,
      .curso-secao {
        padding: 18px;
      }

      .curso-cabecalho h2 {
        font-size: 23px;
      }

      .quiz-acoes {
        justify-content: stretch;
      }

      .btn-finalizar {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="curso-pagina">

    <header class="curso-topo">
      <h1>Capacita Gov</h1>

      <div class="curso-topo-acoes">
        <button type="button" id="btnVoltar">
          Voltar
        </button>

        <button type="button" id="btnSair">
          Sair
        </button>
      </div>
    </header>

    <div id="estado">
      Carregando curso...
    </div>

    <main id="conteudo" class="curso-conteudo" style="display:none">

      <section class="curso-cabecalho">
        <h2 id="cursoNome"></h2>
        <p id="cursoDescricao"></p>
      </section>

      <section class="curso-secao">
        <h2>Módulos do curso</h2>

        <div id="modulos"></div>
      </section>

      <section class="curso-secao" id="secaoPerguntas" style="display:none">

        <h2>Perguntas do curso</h2>

        <div id="perguntas" class="perguntas-lista"></div>

        <div class="quiz-acoes">
          <button
            type="button"
            id="btnFinalizarQuiz"
            class="btn-finalizar">
            Finalizar perguntas
          </button>
        </div>

        <div id="resultadoQuiz" class="resultado-quiz"></div>

      </section>

    </main>

  </div>

  <script type="module">

    import {
      supabase,
      exigirPerfil,
      sair,
      esc
    } from "./js/config.js";


    const el = id => document.getElementById(id);

    let cursoAtual = null;
    let perguntasCurso = [];


    function renderizarAula(aula) {

      return `
        <article class="aula-card">

          <div class="aula-titulo">
            ${esc(aula.titulo || "Aula")}
          </div>

          ${
            aula.descricao
              ? `
                <div class="aula-descricao">
                  ${esc(aula.descricao)}
                </div>
              `
              : ""
          }

          ${
            aula.material_url
              ? `
                <div class="aula-material">
                  <a
                    href="${esc(aula.material_url)}"
                    target="_blank"
                    rel="noopener noreferrer">
                    Abrir material
                  </a>
                </div>
              `
              : ""
          }

        </article>
      `;
    }


    async function carregarAulas(modulos) {

      if (!modulos.length) {
        return [];
      }

      const ids = modulos.map(modulo => modulo.id);

      const { data, error } = await supabase
        .from("aulas")
        .select("*")
        .in("modulo_id", ids)
        .eq("ativo", true)
        .order("ordem", { ascending: true });

      if (error) {
        throw new Error(
          "Erro ao carregar aulas: " + error.message
        );
      }

      return data || [];
    }


    function renderizarModulos(modulos, aulas) {

      const container = el("modulos");

      if (!modulos.length) {

        container.innerHTML = `
          <p>
            Nenhum módulo disponível neste curso.
          </p>
        `;

        return;
      }

      container.innerHTML = modulos
        .map(modulo => {

          const aulasModulo = aulas.filter(
            aula => aula.modulo_id === modulo.id
          );

          return `
            <article class="modulo-card">

              <div class="modulo-titulo">
                ${esc(modulo.nome || "Módulo")}
              </div>

              <div class="aulas-lista">

                ${
                  aulasModulo.length
                    ? aulasModulo
                        .map(renderizarAula)
                        .join("")
                    : `
                      <p>
                        Nenhuma aula disponível neste módulo.
                      </p>
                    `
                }

              </div>

            </article>
          `;

        })
        .join("");
    }


    function renderizarPerguntas() {

      const secao = el("secaoPerguntas");
      const lista = el("perguntas");

      if (!perguntasCurso.length) {

        secao.style.display = "none";

        return;
      }

      secao.style.display = "block";


      lista.innerHTML =
        perguntasCurso
          .map((pergunta, indice) => {

            return `
              <article class="pergunta-card">

                <div class="pergunta-numero">
                  Pergunta ${indice + 1}
                </div>

                <p class="pergunta-enunciado">
                  ${esc(
                    pergunta.pergunta ||
                    "Pergunta"
                  )}
                </p>

                <div class="alternativas">

                  <label class="alternativa">

                    <input
                      type="radio"
                      name="pergunta-${esc(pergunta.id)}"
                      value="1">

                    <span>
                      ${esc(pergunta.opcao_a || "")}
                    </span>

                  </label>


                  <label class="alternativa">

                    <input
                      type="radio"
                      name="pergunta-${esc(pergunta.id)}"
                      value="2">

                    <span>
                      ${esc(pergunta.opcao_b || "")}
                    </span>

                  </label>


                  <label class="alternativa">

                    <input
                      type="radio"
                      name="pergunta-${esc(pergunta.id)}"
                      value="3">

                    <span>
                      ${esc(pergunta.opcao_c || "")}
                    </span>

                  </label>

                </div>

              </article>
            `;

          })
          .join("");


      /*
       * Permite que o CSS controle
       * quando o resultado aparece.
       */
      el("resultadoQuiz").style.display = "";

    }


    function finalizarQuiz() {

      if (!perguntasCurso.length) {
        return;
      }


      let acertos = 0;
      let respondidas = 0;


      perguntasCurso.forEach(pergunta => {

        const selecionada =
          document.querySelector(
            `input[name="pergunta-${pergunta.id}"]:checked`
          );


        if (!selecionada) {
          return;
        }


        respondidas++;


        if (
          Number(selecionada.value) ===
          Number(pergunta.resposta_correta)
        ) {

          acertos++;

        }

      });


      const resultado = el("resultadoQuiz");
      const total = perguntasCurso.length;


      if (respondidas < total) {

        resultado.className =
          "resultado-quiz erro";

        resultado.textContent =
          `Você respondeu ${respondidas} de ${total} perguntas. Responda todas antes de finalizar.`;

        return;
      }


      const percentual =
        Math.round((acertos / total) * 100);


      resultado.className =
        "resultado-quiz " +
        (percentual >= 50 ? "sucesso" : "erro");


      resultado.innerHTML = `

        <div class="resultado-percentual">
          ${percentual}%
        </div>

        <div class="resultado-detalhe">
          ${acertos} de ${total} acertos
        </div>

        <div class="resultado-mensagem">

          ${
            percentual >= 50
              ? "Parabéns, você foi aprovado!"
              : "Continue estudando e tente novamente!"
          }

        </div>

      `;

    }


    async function carregarPerguntas(cursoId) {

      const { data, error } = await supabase
        .from("questoes")
        .select("*")
        .eq("curso_id", cursoId)
        .order("ordem", { ascending: true });


      if (error) {

        throw new Error(
          "Erro ao carregar perguntas: " +
          error.message
        );

      }


      perguntasCurso = data || [];

      renderizarPerguntas();

    }


    async function iniciar() {

      try {

        await exigirPerfil("aluno");


        const {
          data: {
            session
          }
        } = await supabase.auth.getSession();


        if (!session) {
          throw new Error("Usuário não autenticado.");
        }


        const params =
          new URLSearchParams(
            window.location.search
          );


        const cursoId =
          params.get("id");


        if (!cursoId) {
          throw new Error(
            "Curso não informado."
          );
        }


        const {
          data: matricula,
          error: erroMatricula
        } = await supabase
          .from("matriculas")
          .select("id, ativo")
          .eq("usuario_id", session.user.id)
          .eq("curso_id", cursoId)
          .eq("ativo", true)
          .maybeSingle();


        if (erroMatricula) {

          throw new Error(
            "Erro ao verificar matrícula: " +
            erroMatricula.message
          );

        }


        if (!matricula) {

          throw new Error(
            "Você não está matriculado neste curso."
          );

        }


        const {
          data: curso,
          error: erroCurso
        } = await supabase
          .from("cursos")
          .select("*")
          .eq("id", cursoId)
          .eq("ativo", true)
          .single();


        if (erroCurso) {

          throw new Error(
            "Erro ao carregar curso: " +
            erroCurso.message
          );

        }


        if (!curso) {

          throw new Error(
            "Curso não encontrado."
          );

        }


        cursoAtual = curso;


        el("cursoNome").textContent =
          curso.nome || "Curso";


        el("cursoDescricao").textContent =
          curso.descricao ||
          "Curso disponível no Capacita Gov.";


        const {
          data: modulos,
          error: erroModulos
        } = await supabase
          .from("modulos")
          .select("*")
          .eq("curso_id", cursoId)
          .eq("ativo", true)
          .order("ordem", {
            ascending: true
          });


        if (erroModulos) {

          throw new Error(
            "Erro ao carregar módulos: " +
            erroModulos.message
          );

        }


        const listaModulos =
          modulos || [];


        const aulas =
          await carregarAulas(
            listaModulos
          );


        renderizarModulos(
          listaModulos,
          aulas
        );


        await carregarPerguntas(
          cursoId
        );


        el("estado").style.display =
          "none";

        el("conteudo").style.display =
          "block";

      }

      catch (erro) {

        console.error(erro);

        el("estado").textContent =
          "Erro inesperado: " +
          erro.message;

      }

    }


    el("btnVoltar")
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "aluno.html";

        }
      );


    el("btnSair")
      .addEventListener(
        "click",
        async () => {

          await sair();

        }
      );


    el("btnFinalizarQuiz")
      .addEventListener(
        "click",
        finalizarQuiz
      );


    iniciar();

  </script>

</body>
</html>
