<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curso - Capacita Gov</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    :root {
      --azul-900: #0f2a5c;
      --azul-700: #1d4ed8;
      --azul-600: #2563eb;
      --azul-100: #dbeafe;
      --azul-50: #eff6ff;
      --texto: #0f172a;
      --texto-suave: #475569;
      --borda: #e2e8f0;
      --verde: #15803d;
      --verde-bg: #f0fdf4;
      --vermelho: #b91c1c;
      --vermelho-bg: #fef2f2;
    }

    body {
      margin: 0;
      background: linear-gradient(180deg, var(--azul-50) 0%, #f8fafc 280px);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
    }

    .curso-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .curso-topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      padding: 14px 20px;
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(15,42,92,.06);
    }

    .curso-topo strong {
      color: var(--azul-900);
      font-size: 18px;
      letter-spacing: .2px;
    }

    .curso-topo .acoes {
      display: flex;
      gap: 8px;
    }

    .curso-btn {
      cursor: pointer;
      border: 1px solid var(--azul-700);
      background: var(--azul-700);
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      transition: background .15s, box-shadow .15s, transform .1s;
    }

    .curso-btn:hover {
      background: var(--azul-900);
      border-color: var(--azul-900);
      box-shadow: 0 4px 10px rgba(29,78,216,.25);
    }

    .curso-btn:active {
      transform: translateY(1px);
    }

    .curso-btn.sec {
      background: #fff;
      color: var(--azul-700);
    }

    .curso-btn.sec:hover {
      background: var(--azul-50);
      color: var(--azul-900);
      box-shadow: none;
    }

    .curso-header {
      background: linear-gradient(135deg, var(--azul-900), var(--azul-700));
      color: #fff;
      padding: 28px 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(29,78,216,.25);
    }

    .curso-header h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.2;
    }

    .curso-header p {
      margin: 0;
      color: #dbeafe;
      line-height: 1.6;
      font-size: 15px;
    }

    .curso-secao {
      margin-top: 36px;
    }

    .curso-secao h2 {
      margin: 0 0 16px;
      font-size: 20px;
      color: var(--azul-900);
      padding-left: 12px;
      border-left: 4px solid var(--azul-600);
    }

    .modulos-lista {
      display: grid;
      gap: 18px;
    }

    .modulo-card {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(15,42,92,.06);
    }

    .modulo-topo {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .modulo-num {
      flex: 0 0 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--azul-600), var(--azul-900));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }

    .modulo-card h3 {
      margin: 0 0 4px;
      font-size: 18px;
      color: var(--texto);
    }

    .modulo-card > .modulo-topo p {
      margin: 0;
      color: var(--texto-suave);
      font-size: 14px;
      line-height: 1.5;
    }

    .aulas-lista {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .aula-card {
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 16px;
      background: #f8fafc;
    }

    .aula-tipo {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--azul-100);
      color: #1e3a8a;
      font-size: 12px;
      font-weight: 700;
    }

    .aula-card h4 {
      margin: 0 0 8px;
      font-size: 16px;
      color: var(--texto);
    }

    .aula-texto {
      margin: 0;
      color: var(--texto-suave);
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .aula-acoes {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .link-material {
      display: inline-block;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 9px;
      background: var(--azul-700);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .link-material:hover {
      background: var(--azul-900);
    }

    .perguntas-lista {
      display: grid;
      gap: 18px;
    }

    .pergunta-card {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 1px 3px rgba(15,42,92,.06);
    }

    .pergunta-numero {
      color: var(--azul-700);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .pergunta-enunciado {
      margin: 0 0 16px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
    }

    .alternativas {
      display: grid;
      gap: 9px;
    }

    .alternativa {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--borda);
      border-radius: 10px;
      cursor: pointer;
      background: #fff;
      transition: background .15s, border-color .15s;
    }

    .alternativa:hover {
      background: var(--azul-50);
      border-color: var(--azul-100);
    }

    .alternativa input {
      margin-top: 3px;
    }

    .resultado-quiz {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-weight: 600;
      display: none;
    }

    .resultado-quiz.sucesso {
      display: block;
      background: var(--verde-bg);
      color: var(--verde);
      border: 1px solid #bbf7d0;
    }

    .resultado-quiz.erro {
      display: block;
      background: var(--vermelho-bg);
      color: var(--vermelho);
      border: 1px solid #fecaca;
    }

    .btn-finalizar {
      margin-top: 20px;
      cursor: pointer;
      border: 1px solid var(--azul-700);
      background: var(--azul-700);
      color: #fff;
      padding: 11px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
    }

    .btn-finalizar:hover {
      background: var(--azul-900);
    }

    .aviso {
      padding: 16px 18px;
      border-radius: 12px;
      margin-top: 16px;
      font-size: 15px;
      line-height: 1.5;
    }

    .aviso.erro {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .aviso.info {
      background: var(--azul-50);
      color: #1e3a8a;
      border: 1px solid var(--azul-100);
    }

    .vazio {
      padding: 16px;
      background: #f8fafc;
      border: 1px dashed var(--borda);
      border-radius: 10px;
      color: var(--texto-suave);
    }

    @media (max-width: 600px) {
      .curso-wrap {
        padding: 16px 12px 32px;
      }

      .curso-topo {
        padding: 12px 14px;
      }

      .curso-header {
        padding: 22px 18px;
      }

      .curso-header h1 {
        font-size: 22px;
      }

      .modulo-card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="curso-wrap">

    <div class="curso-topo">
      <strong>Capacita Gov</strong>

      <div class="acoes">
        <button class="curso-btn sec" id="btnVoltar" type="button">
          Voltar
        </button>

        <button class="curso-btn" id="btnSair" type="button">
          Sair
        </button>
      </div>
    </div>

    <div id="estado" class="aviso info">
      Carregando curso...
    </div>

    <div id="conteudo" style="display:none">

      <div class="curso-header">
        <h1 id="cursoNome"></h1>
        <p id="cursoDescricao"></p>
      </div>

      <!-- MÓDULOS -->
      <section class="curso-secao">
        <h2>📚 Conteúdo do curso</h2>

        <div id="modulos" class="modulos-lista"></div>
      </section>

      <!-- PERGUNTAS -->
      <section class="curso-secao" id="secaoPerguntas" style="display:none">
        <h2>❓ Perguntas do curso</h2>

        <div id="perguntas" class="perguntas-lista"></div>

        <button
          type="button"
          id="btnFinalizarQuiz"
          class="btn-finalizar">
          Finalizar perguntas
        </button>

        <div id="resultadoQuiz" class="resultado-quiz"></div>
      </section>

    </div>
  </div>

  <script type="module">

    import {
      supabase,
      exigirPerfil,
      sair,
      esc
    } from "./js/config.js";

    const el = id => document.getElementById(id);

    let perguntasCurso = [];

    function mostrarEstado(msg, tipo) {

      const e = el("estado");

      e.className = "aviso " + (tipo || "info");

      e.textContent = msg;

      e.style.display = "block";

      el("conteudo").style.display = "none";
    }

    function tipoAula(tipo) {

      const tipos = {
        texto: "📝 Texto",
        atividade: "📄 Material",
        video: "🔗 Material externo",
        pdf: "📄 PDF"
      };

      return tipos[String(tipo || "").toLowerCase()] || "📚 Conteúdo";
    }

    function renderizarAula(aula) {

      const tipo = String(aula.tipo || "").toLowerCase();

      let conteudo = "";

      /*
       * TEXTO
       */
      if (tipo === "texto") {

        conteudo = `
          <p class="aula-texto">
            ${esc(aula.descricao || "")}
          </p>
        `;

      /*
       * PDF / MATERIAL
       */
      } else if (
        tipo === "atividade" ||
        tipo === "pdf"
      ) {

        conteudo = `
          <p class="aula-texto">
            ${esc(aula.descricao || "Material disponível para consulta.")}
          </p>

          ${
            aula.url
              ? `
                <div class="aula-acoes">
                  <a
                    class="link-material"
                    href="${esc(aula.url)}"
                    target="_blank"
                    rel="noopener noreferrer">
                    📄 Abrir material
                  </a>
                </div>
              `
              : ""
          }
        `;

      /*
       * LINK EXTERNO / VÍDEO
       */
      } else if (
        tipo === "video" ||
        tipo === "link"
      ) {

        conteudo = `
          <p class="aula-texto">
            ${esc(aula.descricao || "Material externo disponível.")}
          </p>

          ${
            aula.url
              ? `
                <div class="aula-acoes">
                  <a
                    class="link-material"
                    href="${esc(aula.url)}"
                    target="_blank"
                    rel="noopener noreferrer">
                    🔗 Acessar material
                  </a>
                </div>
              `
              : ""
          }
        `;

      /*
       * OUTROS TIPOS
       */
      } else {

        conteudo = `
          ${
            aula.descricao
              ? `<p class="aula-texto">${esc(aula.descricao)}</p>`
              : ""
          }

          ${
            aula.url
              ? `
                <div class="aula-acoes">
                  <a
                    class="link-material"
                    href="${esc(aula.url)}"
                    target="_blank"
                    rel="noopener noreferrer">
                    🔗 Abrir conteúdo
                  </a>
                </div>
              `
              : ""
          }
        `;
      }

      return `
        <div class="aula-card">

          <span class="aula-tipo">
            ${esc(tipoAula(aula.tipo))}
          </span>

          <h4>
            ${esc(aula.titulo || "Conteúdo")}
          </h4>

          ${conteudo}

        </div>
      `;
    }

    async function carregarAulas(modulos) {

      const moduloIds = modulos.map(m => m.id);

      if (!moduloIds.length) {
        return {};
      }

      const {
        data: aulas,
        error
      } = await supabase
        .from("aulas")
        .select("*")
        .in("modulo_id", moduloIds)
        .eq("ativo", true)
        .order("ordem", { ascending: true });

      if (error) {
        throw new Error(
          "Erro ao carregar conteúdos: " + error.message
        );
      }

      const agrupadas = {};

      (aulas || []).forEach(aula => {

        if (!agrupadas[aula.modulo_id]) {
          agrupadas[aula.modulo_id] = [];
        }

        agrupadas[aula.modulo_id].push(aula);

      });

      return agrupadas;
    }

    function renderizarModulos(modulos, aulasPorModulo) {

      const lista = el("modulos");

      if (!modulos || modulos.length === 0) {

        lista.innerHTML = `
          <div class="vazio">
            Este curso ainda não possui módulos cadastrados.
          </div>
        `;

        return;
      }

      lista.innerHTML = modulos.map((m, i) => {

        const aulas = aulasPorModulo[m.id] || [];

        return `
          <article class="modulo-card">

            <div class="modulo-topo">

              <div class="modulo-num">
                ${esc(m.ordem != null ? m.ordem : i + 1)}
              </div>

              <div>
                <h3>
                  ${esc(m.nome || m.titulo || "Módulo")}
                </h3>

                ${
                  m.descricao
                    ? `<p>${esc(m.descricao)}</p>`
                    : ""
                }
              </div>

            </div>

            ${
              aulas.length
                ? `
                  <div class="aulas-lista">
                    ${aulas.map(renderizarAula).join("")}
                  </div>
                `
                : `
                  <div class="vazio">
                    Este módulo ainda não possui conteúdos.
                  </div>
                `
            }

          </article>
        `;

      }).join("");
    }

    function renderizarPerguntas() {

      const secao = el("secaoPerguntas");
      const lista = el("perguntas");

      if (!perguntasCurso.length) {

        secao.style.display = "none";
        return;
      }

      secao.style.display = "block";

      lista.innerHTML = perguntasCurso.map((pergunta, indice) => {

        return `
          <article class="pergunta-card">

            <div class="pergunta-numero">
              Pergunta ${indice + 1}
            </div>

            <p class="pergunta-enunciado">
              ${esc(
                pergunta.enunciado ||
                pergunta.pergunta ||
                pergunta.titulo ||
                "Pergunta"
              )}
            </p>

            <div class="alternativas">

              <label class="alternativa">
                <input
                  type="radio"
                  name="pergunta-${esc(pergunta.id)}"
                  value="1">

                <span>
                  ${esc(pergunta.opcao1 || "")}
                </span>
              </label>

              <label class="alternativa">
                <input
                  type="radio"
                  name="pergunta-${esc(pergunta.id)}"
                  value="2">

                <span>
                  ${esc(pergunta.opcao2 || "")}
                </span>
              </label>

              <label class="alternativa">
                <input
                  type="radio"
                  name="pergunta-${esc(pergunta.id)}"
                  value="3">

                <span>
                  ${esc(pergunta.opcao3 || "")}
                </span>
              </label>

            </div>

          </article>
        `;

      }).join("");

      el("resultadoQuiz").style.display = "none";
    }

    function finalizarQuiz() {

      if (!perguntasCurso.length) {
        return;
      }

      let acertos = 0;
      let respondidas = 0;

      perguntasCurso.forEach(pergunta => {

        const selecionada = document.querySelector(
          `input[name="pergunta-${pergunta.id}"]:checked`
        );

        if (!selecionada) {
          return;
        }

        respondidas++;

        if (
          Number(selecionada.value) ===
          Number(pergunta.resposta_correta)
        ) {
          acertos++;
        }

      });

      const resultado = el("resultadoQuiz");

      const total = perguntasCurso.length;

      if (respondidas < total) {

        resultado.className = "resultado-quiz erro";

        resultado.textContent =
          `Você respondeu ${respondidas} de ${total} perguntas. Responda todas antes de finalizar.`;

        return;
      }

      const percentual = Math.round(
        (acertos / total) * 100
      );

      resultado.className = "resultado-quiz " +
        (percentual >= 50 ? "sucesso" : "erro");

      resultado.textContent =
        `Resultado: ${acertos} de ${total} acertos (${percentual}%).`;

    }

    async function carregarPerguntas(cursoId) {

      const {
        data,
        error
      } = await supabase
        .from("questoes")
        .select("*")
        .eq("curso_id", cursoId)
        .order("ordem", { ascending: true });

      if (error) {

        throw new Error(
          "Erro ao carregar perguntas: " +
          error.message
        );
      }

      perguntasCurso = data || [];

      renderizarPerguntas();
    }

    el("btnVoltar").addEventListener(
      "click",
      () => {
        window.location.href = "aluno.html";
      }
    );

    el("btnSair").addEventListener(
      "click",
      () => sair()
    );

    el("btnFinalizarQuiz").addEventListener(
      "click",
      finalizarQuiz
    );

    async function iniciar() {

      /*
       * 1. Verificar perfil
       */
      const perfil = await exigirPerfil("aluno");

      if (!perfil) {
        return;
      }

      /*
       * 2. Usuário logado
       */
      const {
        data: sess
      } = await supabase.auth.getSession();

      const user = sess?.session?.user;

      if (!user) {

        window.location.href = "index.html";

        return;
      }

      /*
       * 3. ID do curso
       */
      const cursoId =
        new URLSearchParams(
          window.location.search
        ).get("id");

      if (!cursoId) {

        return mostrarEstado(
          "Curso não informado na URL.",
          "erro"
        );
      }

      /*
       * 4. Verificar matrícula
       */
      const {
        data: mat,
        error: errMat
      } = await supabase
        .from("matriculas")
        .select("*")
        .eq("usuario_id", user.id)
        .eq("curso_id", cursoId)
        .eq("ativo", true)
        .limit(1);

      if (errMat) {

        return mostrarEstado(
          "Erro ao verificar matrícula: " +
          errMat.message,
          "erro"
        );
      }

      if (!mat || mat.length === 0) {

        return mostrarEstado(
          "Acesso não autorizado: você não está matriculado neste curso.",
          "erro"
        );
      }

      /*
       * 5. Carregar curso
       */
      const {
        data: curso,
        error: errCurso
      } = await supabase
        .from("cursos")
        .select("*")
        .eq("id", cursoId)
        .maybeSingle();

      if (errCurso || !curso) {

        return mostrarEstado(
          "Curso não encontrado.",
          "erro"
        );
      }

      el("cursoNome").textContent =
        curso.nome ||
        curso.titulo ||
        "Curso";

      el("cursoDescricao").textContent =
        curso.descricao || "";

      /*
       * 6. Carregar módulos
       */
      const {
        data: modulos,
        error: errMod
      } = await supabase
        .from("modulos")
        .select("*")
        .eq("curso_id", cursoId)
        .eq("ativo", true)
        .order("ordem", {
          ascending: true
        });

      if (errMod) {

        return mostrarEstado(
          "Erro ao carregar módulos: " +
          errMod.message,
          "erro"
        );
      }

      /*
       * 7. Carregar aulas/conteúdos
       */
      const aulasPorModulo =
        await carregarAulas(modulos || []);

      /*
       * 8. Mostrar módulos + conteúdos
       */
      renderizarModulos(
        modulos || [],
        aulasPorModulo
      );

      /*
       * 9. Carregar perguntas
       */
      await carregarPerguntas(cursoId);

      /*
       * 10. Mostrar página
       */
      el("estado").style.display = "none";

      el("conteudo").style.display = "block";
    }

    iniciar().catch(err => {

      console.error(
        "Erro ao carregar curso:",
        err
      );

      mostrarEstado(
        "Erro inesperado: " +
        err.message,
        "erro"
      );

    });

  </script>

</body>
</html>
