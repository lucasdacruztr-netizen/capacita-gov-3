<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área do aluno · Capacita Gov</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Oculto até o perfil do aluno ser confirmado (evita "piscar" a página) -->
<body hidden>
  <div class="layout">
    <aside class="side">
      <div class="brand">Capacita Gov</div>
      <nav>
        <a class="nav-btn ativo" href="#meus-cursos">Meus cursos</a>
        <a class="nav-btn" href="#catalogo">Catálogo</a>
      </nav>
      <button id="btn-sair" class="btn ghost" type="button">Sair</button>
    </aside>

    <main>
      <header class="top">
        <h1 id="titulo-boas-vindas">Olá!</h1>
        <span class="mut" style="display:flex;align-items:center;gap:.5rem">
          <span id="aluno-avatar-letra"
                style="width:34px;height:34px;border-radius:50%;background:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;font-weight:700"></span>
          Aluno: <b id="aluno-nome"></b>
        </span>
      </header>

      <!-- ============ PESQUISA ============ -->
      <section class="card" style="margin-bottom:1rem">
        <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <input id="campo-busca" type="search" placeholder="Pesquisar cursos"
                 autocomplete="off" style="flex:1;min-width:220px">
          <button id="btn-pesquisar" class="btn" type="button">Pesquisar</button>
        </div>
      </section>

      <!-- ============ MEUS CURSOS ============ -->
      <section id="meus-cursos" style="margin-bottom:2rem">
        <h2>Meus cursos</h2>
        <div id="cursos" class="grid"></div>
      </section>

      <!-- ============ CATÁLOGO ============ -->
      <section id="catalogo">
        <h2>Catálogo de cursos</h2>
        <div id="categorias" style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem"></div>
        <div id="catalogo-cursos" class="grid"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/aluno.js"></script>

  <!-- Esconde só estes cursos, visualmente, para todos os alunos -->
  <script>
    (function () {
      const ESCONDER = ["343232", "aaaaaaaaaaaaa", "admistracao", "sadsdsa"];

      const norm = t =>
        (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();

      const bloqueados = ESCONDER.map(norm);

      function filtrar() {
        document
          .querySelectorAll("#catalogo-cursos > *, #cursos > *")
          .forEach(card => {
            const titulo = card.querySelector(".curso-titulo, h3");
            if (titulo && bloqueados.includes(norm(titulo.textContent))) {
              card.style.display = "none";
            }
          });
      }

      filtrar();

      new MutationObserver(filtrar).observe(document.body, {
        childList: true,
        subtree: true
      });
    })();
  </script>
</body>
</html>
